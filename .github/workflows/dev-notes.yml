name: dev-notes
on:
  pull_request:
  push:
    branches: [main]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Drift check
        run: python dev-notes/tools/check.py --base "origin/${{ github.base_ref || 'main' }}"
